<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цивилист V5: проверка размеров</title><style>*{box-sizing:border-box}body{margin:0;background:#dae0d4;font:12px sans-serif;color:#263129}header{height:58px;display:flex;gap:12px;align-items:center;padding:10px 18px;background:#faf9f3}button,select{padding:8px;background:#fff;border:1px solid #a0ab97;font:inherit}#display{position:relative;margin:10px auto;overflow:hidden;box-shadow:0 0 0 1px #98a48d}iframe{border:0;transform-origin:top left;background:#f6f4ee}#status{margin-left:auto}</style></head><body><header><b>Проверка layout viewport</b><label>Размер <select id="size"><option>1366x768</option><option>1440x900</option><option selected>1920x1080</option><option>2560x1440</option><option>3840x2160</option><option>390x844</option></select></label><button id="refresh">Обновить</button><span id="status"></span></header><div id="display"><iframe title="Проверяемый атлас" src="/"></iframe></div><script>const frame=document.querySelector('iframe'),display=document.querySelector('#display'),select=document.querySelector('#size');function resize(){const [w,h]=select.value.split('x').map(Number),s=Math.min((innerWidth-24)/w,(innerHeight-80)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${s})`;display.style.width=w*s+'px';display.style.height=h*s+'px';document.querySelector('#status').textContent=`${w} × ${h} / масштаб ${s.toFixed(3)}`}select.onchange=resize;document.querySelector('#refresh').onclick=()=>frame.src='/';addEventListener('resize',resize);resize();</script></body></html>
