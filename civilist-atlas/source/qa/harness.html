<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Проверка компоновки атласа</title>
<style>
  html,body{margin:0;background:#263746;color:#fff;font:14px Arial}
  header{height:46px;display:flex;align-items:center;gap:14px;padding:0 12px}
  button{background:#fff;border:0;padding:5px 9px;cursor:pointer}
  #frame{border:0;transform-origin:top left;background:white}
  #stage{overflow:auto;height:calc(100vh - 46px)}
</style>
<header><strong>ПРОВЕРКА КОМПОНОВКИ</strong><span id="size"></span>
  <button data-size="1366,768">1366 × 768</button>
  <button data-size="1440,900">1440 × 900</button>
  <button data-size="1920,1080">1920 × 1080</button>
  <button data-size="2560,1440">2560 × 1440</button>
  <button data-size="3840,2160">3840 × 2160</button>
</header>
<div id="stage"><iframe id="frame" title="Атлас" src="/"></iframe></div>
<script>
  const frame=document.querySelector('#frame');
  function setSize(w,h){
    const scale=Math.min((innerWidth-20)/w,(innerHeight-65)/h,1);
    frame.style.width=w+'px';frame.style.height=h+'px';
    frame.style.transform=`scale(${scale})`;
    document.querySelector('#size').textContent=`${w} × ${h} / масштаб ${scale.toFixed(2)}`;
  }
  document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>setSize(...b.dataset.size.split(',').map(Number)));
  setSize(1366,768);
</script>
</html>
